# Deploy to Cloudflare Pages on every push to main — but only if the tests and
# build both pass first. If a change breaks the streak/rollover rules, the test
# step fails and nothing ships.
#
# Requires one repo secret:
#   CLOUDFLARE_API_TOKEN — a token with "Account · Cloudflare Pages · Edit".
# The account ID below is an identifier, not a secret, so it's inlined.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Viewport-fit E2E
        run: node scripts/e2e/viewport.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 19b837146074efecc8b822c1c06d2f7b
          command: pages deploy dist --project-name=the-rebuild --branch=main
