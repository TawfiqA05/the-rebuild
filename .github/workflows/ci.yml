# Build + test check for pull requests, before anything merges to main.
# Pushes to main are built, tested, and deployed by deploy.yml, so this runs on
# PRs (and on demand) to catch a broken build or a broken rule early.

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Viewport-fit E2E
        run: node scripts/e2e/viewport.mjs
