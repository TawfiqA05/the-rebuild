# Build check for pull requests — verifies the app still builds before merge.
# Pushes to main are built + deployed by deploy.yml, so this only runs on PRs
# (and on-demand) to avoid building twice on every push.

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
