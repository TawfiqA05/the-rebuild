<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: same mark, scaled into the centre safe zone (~72%) with an
       ivory full-bleed background so adaptive masks can't clip the steps. -->
  <rect width="512" height="512" fill="#f5f0e6"/>
  <g stroke="#7c5a12" stroke-width="58" stroke-linecap="round"
     transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <line x1="116" y1="404" x2="116" y2="300"/>
    <line x1="210" y1="404" x2="210" y2="250"/>
    <line x1="304" y1="404" x2="304" y2="196"/>
    <line x1="398" y1="404" x2="398" y2="138"/>
  </g>
</svg>
