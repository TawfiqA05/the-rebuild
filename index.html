<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f5f0e6" />
    <meta name="description" content="The Rebuild — build the person you're becoming, one rep at a time." />
    <!-- Typography: Fraunces (display serif with character) + Inter (body). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
    />
    <!-- Favicons: scalable SVG with a 32px PNG fallback. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <!-- PWA manifest + iOS install meta. Service worker is registered in main.jsx. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      /* Warm ivory paint before JS/CSS loads — no flash. */
      html, body { background: #f5f0e6; }
    </style>
    <script>
      /* Paint the saved theme's background + data-theme before first paint, so
         a dark-theme device doesn't flash ivory on a cold start. */
      (function () {
        try {
          var id = localStorage.getItem('rebuild:theme-id')
          var bg = localStorage.getItem('rebuild:bg')
          if (id) document.documentElement.setAttribute('data-theme', id)
          if (bg) { document.documentElement.style.background = bg }
        } catch (e) {}
      })()
    </script>
    <meta name="apple-mobile-web-app-title" content="The Rebuild" />
    <title>The Rebuild</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
